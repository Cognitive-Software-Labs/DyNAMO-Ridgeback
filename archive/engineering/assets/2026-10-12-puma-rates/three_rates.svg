<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="title desc">
  <title id="title">Three Puma feedback rates</title>
  <desc id="desc">Stationary host-observed rates from the passive capture 20261012-wheel-can-rate. The ROS aggregate is published at 20 Hz. Status-class speed frames arrive at about 25.6 Hz per wheel and outgoing speed-setpoint commands leave at about 20.0 Hz per wheel. The diagnostic counter counts incoming speed-setpoint replies: about 20.0 Hz for each front wheel, 19.7 Hz rear-left and 16.4 Hz rear-right, all below the hardcoded 40 Hz diagnostic target.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #6e7781; }
    .head { font-weight: 600; font-size: 13.5px; }
    .value { font-size: 12px; }
    .axis { stroke: #8b949e; stroke-width: 1; fill: none; }
    .grid { stroke: #8b949e; stroke-width: 0.6; stroke-dasharray: 2 4; opacity: 0.6; }
    .pub { fill: #2f81f7; }
    .can { fill: #3fb950; }
    .tx { fill: #8b949e; }
    .reply { fill: #d29922; }
    .low { fill: #f0883e; }
    .target { stroke: #f85149; stroke-width: 1.6; stroke-dasharray: 6 4; fill: none; }
    .target-text { fill: #f85149; font-weight: 600; }
    @media (prefers-color-scheme: dark) { text { fill: #b1bac4; } }
  </style>

  <!-- grid: x = 330 + 8 px per Hz -->
  <line class="grid" x1="410" y1="30" x2="410" y2="282"/>
  <line class="grid" x1="490" y1="30" x2="490" y2="282"/>
  <line class="grid" x1="570" y1="30" x2="570" y2="282"/>
  <line class="target" x1="650" y1="24" x2="650" y2="282"/>
  <text class="target-text" x="656" y="38">diagnostic target</text>
  <text class="target-text" x="656" y="54">40 Hz</text>

  <!-- group 1 -->
  <text class="head" x="16" y="40">1. Aggregate publication (node timer)</text>
  <text x="32" y="69">ROS PumaMultiFeedback</text>
  <rect class="pub" x="330" y="56" width="160" height="18" rx="2"/>
  <text class="value" x="496" y="69">20 Hz</text>

  <!-- group 2 -->
  <text class="head" x="16" y="106">2. Per-field CAN arrival (each wheel)</text>
  <text x="32" y="135">Status-class speed frames (RX)</text>
  <rect class="can" x="330" y="122" width="205" height="18" rx="2"/>
  <text class="value" x="541" y="135">25.6 Hz</text>
  <text x="32" y="161">Speed-setpoint commands (TX)</text>
  <rect class="tx" x="330" y="148" width="160" height="18" rx="2"/>
  <text class="value" x="496" y="161">20.0 Hz</text>

  <!-- group 3 -->
  <text class="head" x="16" y="198">3. Diagnostic counter: setpoint replies (RX)</text>
  <text x="32" y="227">Front-left and front-right</text>
  <rect class="reply" x="330" y="214" width="160" height="18" rx="2"/>
  <text class="value" x="496" y="227">20.0 Hz</text>
  <text x="32" y="253">Rear-left</text>
  <rect class="reply" x="330" y="240" width="158" height="18" rx="2"/>
  <text class="value" x="494" y="253">19.7 Hz</text>
  <text x="32" y="279">Rear-right</text>
  <rect class="low" x="330" y="266" width="131" height="18" rx="2"/>
  <text class="value" x="467" y="279">16.4 Hz, max gap 200.5 ms</text>

  <!-- axis -->
  <line class="axis" x1="330" y1="294" x2="690" y2="294"/>
  <line class="axis" x1="330" y1="294" x2="330" y2="299"/>
  <line class="axis" x1="410" y1="294" x2="410" y2="299"/>
  <line class="axis" x1="490" y1="294" x2="490" y2="299"/>
  <line class="axis" x1="570" y1="294" x2="570" y2="299"/>
  <line class="axis" x1="650" y1="294" x2="650" y2="299"/>
  <text x="326" y="314">0</text>
  <text x="402" y="314">10</text>
  <text x="482" y="314">20</text>
  <text x="562" y="314">30</text>
  <text x="642" y="314">40</text>
  <text x="696" y="314">Hz</text>
</svg>
