serial_number: r100-0001
version: 0
system:
  hosts:
    - hostname: cpr-r100-0001
      ip: 192.168.131.1
  ros2:
    namespace: r100_0001
    domain_id: 0
    middleware:
      implementation: rmw_fastrtps_cpp
    workspaces: []
platform:
  controller: ps4
  battery:
    model: 8A31DTM
    configuration: S1P2
  attachments: []
  extras:
    urdf: null
    ros_parameters: {}
mounts: {}
sensors:
  lidar2d:
    - model: hokuyo_ust
      parent: default_mount
      xyz: [0.3922, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
    - model: hokuyo_ust
      parent: default_mount
      xyz: [-0.3922, 0.0, 0.05]
      rpy: [0.0, 0.0, 3.14159]
  camera:
    - model: intel_realsense
      parent: default_mount
      xyz: [0.3, 0.0, 0.85]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        intel_realsense:
          camera_name: camera_0
          device_type: d455
          serial_no: "0"
          enable_color: true
          enable_depth: true
          align_depth.enable: true
          enable_sync: true
