serial_number: r100-0001
version: 0
system:
  hosts:
    - hostname: cpr-r100-0001
      ip: 192.168.131.1
  ros2:
    namespace: r100_0001
    domain_id: 0
    middleware:
      implementation: rmw_fastrtps_cpp
    workspaces: []
platform:
  controller: ps4
  battery:
    model: 8A31DTM
    configuration: S1P2
  attachments: []
  extras:
    urdf: null
    ros_parameters: {}
mounts: {}
sensors:
  lidar2d:
    - model: hokuyo_ust
      parent: base_link
      xyz: [0.3922, 0.0, 0.179]
      rpy: [0.0, 0.0, 0.0]
    - model: hokuyo_ust
      parent: base_link
      xyz: [-0.3922, 0.0, 0.179]
      rpy: [0.0, 0.0, 3.14159]
  camera:
    # Measured 2026-09-10: camera bottom face 0.740 m above the top plate, so
    # 0.280 (deck top) + 0.740 = 1.020 above base_link; default_mount sits at
    # 0.295, hence z = 0.725. The old 0.85 put it 12.5 cm too high -- the same
    # unmeasured-offset error as the 2D lidars, except here the height was
    # wrong rather than the parent. Fore/aft taken as a fraction of the hull
    # (78 of 98 on the tape, applied to the model's 0.9325 m length) because
    # the tape's total ran ~5 cm over both the Clearpath mesh and NVIDIA's
    # asset, which agree with each other and match the spec width exactly.
    - model: intel_realsense
      parent: default_mount
      xyz: [0.2692, 0.0, 0.725]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        intel_realsense:
          camera_name: camera_0
          device_type: d435
          serial_no: "0"
          enable_color: true
          rgb_camera.profile: 1280,720,30
          enable_depth: true
          depth_module.profile: 1280,720,30
