# battery-guard thresholds. After editing:  sudo systemctl restart battery-guard
#
# Voltages are LOAD-COMPENSATED:  V_rest = measured V + current x R_INT
# Defaults come from this robot's own recordings: 9 power cuts, six of them clustered at
# 24.93-25.30 V, so the shutdown threshold sits above that cluster to get there first.

WARN_V=26.0          # warn below this
SHUTDOWN_V=25.7      # shut down below this
PERSIST_S=30         # must stay below for this many seconds (ignores transients)
R_INT=0.062          # ohm: pack + wiring, measured (median dV/dI over 42,088 current steps)
SMOOTH_TAU_S=60      # smoothing time constant
WARN_REPEAT_S=300    # don't repeat the warning more often than this

# warn     = log + desktop pop-up only, never powers off  (start here)
# shutdown = also powers the computer off cleanly
ACTION=warn
