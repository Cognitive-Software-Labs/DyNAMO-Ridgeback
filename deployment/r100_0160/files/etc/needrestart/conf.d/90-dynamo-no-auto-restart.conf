# DyNAMO r100_0160: never restart services automatically after package updates.
# Overrides Clearpath's 10-auto-cp.conf ('a'), which made unattended security
# updates restart clearpath-platform, clearpath-sensors, dynamo-camera, VNC and
# NetworkManager on 2026-10-14. 'l' only lists outdated services; restart them
# (or reboot) at a planned time with the robot stopped.
$nrconf{restart} = 'l';
