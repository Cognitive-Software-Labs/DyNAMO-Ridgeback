# Install on Intel and Thor as /etc/sysctl.d/60-dynamo-dds-buffers.conf, then
# run `sudo sysctl --system`. Raises only the ceiling; the CycloneDDS
# configurations in this directory request up to 16 MiB receive buffers for the
# ROS processes that use them. See docs/physical/intel_thor_transport.md.
net.core.rmem_max = 16777216
