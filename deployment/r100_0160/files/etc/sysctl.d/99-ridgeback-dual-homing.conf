# Keep Ridgeback wired bridge and Wi-Fi stable when both are on the same IPv4 subnet.
# Prevent ARP flux and use loose reverse-path filtering for policy-routed replies.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.default.arp_announce = 2
net.ipv4.conf.br0.arp_ignore = 1
net.ipv4.conf.br0.arp_announce = 2
net.ipv4.conf.wlp3s0.arp_ignore = 1
net.ipv4.conf.wlp3s0.arp_announce = 2
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.br0.rp_filter = 2
net.ipv4.conf.wlp3s0.rp_filter = 2
