[Unit]
Wants=chrony.service
After=chrony.service
[Service]
ExecStart=
ExecStart=/bin/bash -c 'source /etc/clearpath/setup.bash && source /opt/dynamo-puma/76ff6b99a1e35cc56e27e07302aa98f94ebb85f809348e25eaab04a50ef49856/share/puma_motor_driver/local_setup.bash && exec ros2 launch /usr/local/lib/dynamo-hardware/auxiliary_platform.launch.py'

