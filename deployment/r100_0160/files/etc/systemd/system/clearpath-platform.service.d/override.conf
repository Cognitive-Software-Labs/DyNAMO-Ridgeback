[Service]
# Clearpath's own config tooling regenerates teleop_joy.yaml at boot
# (dev: '/dev/input/ps4'), silently reverting the PS4 device path.
# Force it back to ps4 right before every start, regardless of what
# generated it. '+' runs this with full privileges (the unit itself
# runs as User=robot, which lacks write access to /etc/clearpath).
# Guarded with [ -f ... ] so a missing/corrupted config file produces a
# warning instead of a hard ExecStartPre failure - a failed ExecStartPre
# blocks the whole service from starting at all (this is what happened
# during the filesystem corruption incident on 2026-08-13).
ExecStartPre=+/bin/bash -c "[ -f /etc/clearpath/platform/config/teleop_joy.yaml ] && sed -i \"s#dev: '/dev/input/[a-zA-Z0-9]*'#dev: '/dev/input/ps4'#\" /etc/clearpath/platform/config/teleop_joy.yaml || echo 'WARNING: teleop_joy.yaml missing, skipping PS4 device-path fixup'"
# Same regeneration also reverts twist_mux.yaml's "joy" input back to
# joy_teleop/cmd_vel (stock teleop_twist_joy_node, single-axis-per-field).
# Force it back to the dual-stick combiner's output on every start.
ExecStartPre=+/bin/bash -c "[ -f /etc/clearpath/platform/config/twist_mux.yaml ] && sed -i \"s#topic: 'joy_teleop/cmd_vel'#topic: 'joy_teleop/cmd_vel_combined'#\" /etc/clearpath/platform/config/twist_mux.yaml || echo 'WARNING: twist_mux.yaml missing, skipping joy-topic fixup'"
