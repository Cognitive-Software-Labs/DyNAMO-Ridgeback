# https://automaticaddison.com/ros-2-navigation-tuning-guide-nav2/
amcl:
  ros__parameters:
    set_initial_pose: true
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 90
    max_particles: 2000
    min_particles: 1000
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # robot_model_type: "nav2_amcl::DifferentialMotionModel"
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    # Merged front+rear 360 deg scan from clearpath-scan-merger - the same
    # topic SLAM maps with (nav2_slam.yaml). Localising against the raw front
    # lidar while the map had been built from full 360 deg coverage was an
    # inherited inconsistency; both ends now use the merged scan.
    scan_topic: /r100_0160/sensors/scan
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /r100_0160/platform/odom/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 0.1
    default_nav_to_pose_bt_xml: "/opt/mybotshop/src/mybotshop/mmp_nav2/behavior_trees/nav_to_pose.xml"
    # default_nav_through_poses_bt_xml: $(find-pkg-share my_package)/behavior_tree/my_nav_to_pose_bt.xml 
    always_reload_bt_xml: false
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    path_blackboard_id: path
    navigators: ['navigate_to_pose']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator" # In Iron and older versions, "/" was used instead of "::"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator" # In Iron and older versions, "/" was used instead of "::"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    # y velocity is disabled again below (max_vel_y/acc_lim_y: 0.0) - the
    # robot should turn to face where it's driving, not crab-walk sideways,
    # even though the hardware is omni-capable. Threshold value no longer
    # matters with vy always 0, left low/matched to x/theta for consistency.
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3 # Controller failure after 3 seconds 0 to disable -1.0 to never give up
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.3
    # DWB parameters. MPPI was tried for smoother omni trajectories but this
    # box's onboard i3-9100TE (4 cores, already loaded >4 avg with the rest
    # of the nav/webserver stack running) can't keep MPPI's optimizer inside
    # its 20Hz control loop budget even at a cut-down batch_size/time_steps -
    # loop rate dropped to 5-19Hz with "Optimizer fail to compute path" /
    # "Failed to make progress" aborts. Reverted to DWB, keeping the raised
    # velocity/accel ceilings from the speed pass (that part worked fine).
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      # Lateral (y) motion disabled: with it enabled DWB would blend x+y to
      # cut straight-line diagonals to the goal, so the robot translated
      # sideways without turning to face its direction of travel. Zeroing
      # vel/accel here forces pure x+theta motion (turn, then/while drive
      # forward) - RotateToGoal (scale 32.0 below) handles the turning.
      min_vel_y: 0.0
      max_vel_x: 0.6
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.6
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 0.6
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.6
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # Was 0.02 - negligible next to PathAlign/PathDist (32) and GoalAlign/
      # GoalDist (24), so trajectory scoring barely factored in obstacle
      # proximity at all (just barely avoiding the lethal/inscribed zone).
      # Raised so the planner actively prefers clearance, not just no-collision.
      BaseObstacle.scale: 0.3
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 12.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.1
      # +15% over the real footprint ([0.48, 0.3965]) for extra obstacle
      # clearance - the planner/costmap treat the robot as this size for
      # collision checking, not its true physical size.
      footprint: "[ [0.552, 0.456], [0.552, -0.456], [-0.552, -0.456], [-0.552, 0.456] ]"
      plugins: ["obstacle_layer", "denoise_layer", "inflation_layer"] #  [“obstacle_layer”,  “voxel_layer”, “range_sensor_layer”, “denoise_layer”, “inflation_layer”] - (order matters here) 
      # Different from default.
      # Added “voxel_layer” for 3D obstacle representation using a depth camera.
      # Added “range_sensor_layer” for handling range sensor data from an ultrasonic sensor (if you have one). 
      # Added “denoise_layer” for removing salt and pepper noise from the sensors.
      # Removed “static_layer” since it’s not needed for the local costmap.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # Single merged 360 deg source instead of the two raw lidars. One
        # scan in base_link covers both ends, so clearing/raytracing is
        # consistent all the way round instead of two overlapping sectors.
        observation_sources: scan
        scan:
          topic: /r100_0160/sensors/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      denoise_layer: # Causes lag but worth it to filter out reflected/noisy lidar points
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58 # Known number to work well
        inflation_radius:  1.75
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      # +15% over the real footprint ([0.48, 0.3965]) for extra obstacle
      # clearance - the planner/costmap treat the robot as this size for
      # collision checking, not its true physical size.
      footprint: "[ [0.552, 0.456], [0.552, -0.456], [-0.552, -0.456], [-0.552, 0.456] ]"
      resolution: 0.05
      track_unknown_space: True
      plugins: ["static_layer", "static_layer_2", "obstacle_layer", "denoise_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True # False if you need earlier map
      static_layer_2:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: /r100_0160/map_2
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # Single merged 360 deg source, see the local costmap above.
        observation_sources: scan
        scan:
          topic: /r100_0160/sensors/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.5
          obstacle_min_range: 0.0
      denoise_layer: # Causes lag but worth it to filter out reflected/noisy lidar points
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.58
        # Was 0.5, far below the local costmap's 1.75 - the global planner
        # barely penalized wall-hugging paths at all, so it planned tight
        # routes that the local controller then had little room to improve
        # on. Matched to local for consistent clearance preference end to end.
        inflation_radius: 1.75
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 8.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server: # Creates the global plan path
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner" # "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server: # Smooths the global plan path
  ros__parameters:
    enable_stamped_cmd_vel: true
    use_sim_time: False
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_link
    transform_timeout: 0.1
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1 
    use_sim_time: False
    simulate_ahead_time: 6.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 2
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 10

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 0.8]
    min_velocity: [-0.6, 0.0, -0.8]
    max_accel: [0.6, 0.0, 1.0]
    max_decel: [-0.6, 0.0, -1.0]
    odom_topic: "platform/odom/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0