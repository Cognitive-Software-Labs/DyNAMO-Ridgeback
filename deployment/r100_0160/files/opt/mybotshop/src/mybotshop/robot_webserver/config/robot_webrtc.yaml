################################################################################
# robot_webrtc — H.264-over-WebSocket streaming node parameters.
################################################################################
/**:
  ros__parameters:
    enabled: true
    http_port: 9003
    http_address: "0.0.0.0"
    bitrate_kbps: 2500
    gop_size: 30
    max_framerate_fps: 30
    first_frame_timeout_ms: 1000
    max_sessions: 512
    client_buffer_soft_cap_kib: 2048

    encoder_preference:
      - "nvv4l2h264enc"
      - "nvh264enc"
      - "vaapih264enc"
      - "v4l2h264enc"
      - "x264enc"

    topic_blacklist:
      - "/agivslam/reloc_image"
      - "/aima/hal/fish_eye_camera/chest_left/color"
      - "/aima/hal/fish_eye_camera/chest_right/color"
      - "/aima/hal/rgbd_camera/head_front/color"
      - "/aima/hal/rgbd_camera/head_front/depth"
      - "/aima/hal/rgbd_camera/waist_front/color"
      - "/aima/hal/rgbd_camera/waist_front/depth"
      - "/aruco_detector/debug"
