# Ridgeback R100 (r100_0160) 2D-Lidar-Merge: front (lidar2d_0) + rear (lidar2d_1)
# Offsets aus /etc/clearpath/robot.yaml (parent chassis_link ~ base_link):
#   front: xyz[0.3922, 0, 0.1856] rpy[0,0,0]
#   rear:  xyz[-0.4278, 0, 0.1856] rpy[0,0,pi]  (=> Alpha 180)
# WICHTIG: flip/inverse/Alpha muessen LIVE in rqt kalibriert werden (Scan-Overlay in RViz)!
/r100_0160/ros2_laser_scan_merger:
  ros__parameters:
    flip1: false
    flip2: false
    inverse1: false
    inverse2: false
    laser1Alpha: 0.0
    laser1AngleMin: -180.0
    laser1AngleMax: 180.0
    laser1R: 255
    laser1G: 0
    laser1B: 0
    laser1XOff: 0.3922
    laser1YOff: 0.0
    laser1ZOff: 0.1856
    laser2Alpha: 180.0
    laser2AngleMin: -180.0
    laser2AngleMax: 180.0
    laser2R: 0
    laser2G: 0
    laser2B: 255
    laser2XOff: -0.3922
    laser2YOff: 0.0
    laser2ZOff: 0.1856
    pointCloudTopic: cloud_in
    pointCloutFrameId: base_link
    scanTopic1: sensors/lidar2d_0/scan
    scanTopic2: sensors/lidar2d_1/scan
    show1: true
    show2: true
    use_sim_time: false
/r100_0160/pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.05
    min_height: -1.0
    max_height: 1.0
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.1
    range_max: 25.0
    use_inf: true
    inf_epsilon: 1.0
    use_sim_time: false
