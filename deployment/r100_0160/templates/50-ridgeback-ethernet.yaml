# Reconstruction template, NOT a copy of the installed root-private netplan.
# Use at the physical console. Reconcile other netplan files before applying.
# Both ports were bridge members on 2026-10-06; verify names after SSD replacement.
network:
  version: 2
  ethernets:
    eno1:
      renderer: networkd
      dhcp4: false
      optional: true
    enp2s0:
      renderer: networkd
      dhcp4: false
      optional: true
  bridges:
    br0:
      renderer: networkd
      interfaces: [eno1, enp2s0]
      dhcp4: false
      addresses: [192.168.131.1/24, 192.168.123.8/32]
      routes:
        - to: default
          via: 192.168.123.2
          on-link: true
          metric: 100
      parameters:
        stp: false
        forward-delay: 0
