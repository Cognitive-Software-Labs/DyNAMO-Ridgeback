<svg viewBox="0 0 880 940" xmlns="http://www.w3.org/2000/svg" width="880" height="940" role="img">
<title>Ridgeback R100 sensor geometry, as built in the Isaac robot USD</title>
<desc>Side elevation and plan view with every measured sensor position relative to base_link. Generated to match src/ridgeback_autonomy/sim/isaac/usd/robots/ridgeback_r100.</desc>
<style>
  .bg{fill:#ffffff}
  .ttl{font:600 15px system-ui,sans-serif;fill:#16181d}
  .sub{font:400 11.5px system-ui,sans-serif;fill:#6b7280}
  .lbl{font:500 11.5px system-ui,sans-serif;fill:#16181d}
  .mono{font:600 11px ui-monospace,Menlo,monospace;fill:#b0432a}
  .monod{font:500 10.5px ui-monospace,Menlo,monospace;fill:#4b5563}
  .part{fill:#eceef1;stroke:#6b7280;stroke-width:1.2}
  .deck{fill:#d7dade;stroke:#4b5563;stroke-width:1.1}
  .sens{fill:#ffffff;stroke:#b0432a;stroke-width:1.6}
  .mast{fill:#c8cbd0;stroke:#4b5563;stroke-width:1.1}
  .dim{stroke:#b0432a;stroke-width:1.2;fill:none}
  .ref{stroke:#8aa0b8;stroke-width:1;stroke-dasharray:4 3;fill:none}
  .axis{stroke:#16181d;stroke-width:1.6}
</style>
<rect class="bg" x="0" y="0" width="880" height="940"/>

<text class="ttl" x="24" y="30">Ridgeback R100 — sensor geometry as built in the Isaac USD</text>
<text class="sub" x="24" y="48">All values in metres, relative to base_link. Measured against the robot 2026-09-10; matches the committed robot USD.</text>

<!-- ================= SIDE ELEVATION ================= -->
<text class="ttl" x="24" y="82">SIDE ELEVATION  (+X forward →)</text>

<!-- floor / wheel contact -->
<line class="axis" x1="80" y1="479" x2="700" y2="479"/>
<text class="monod" x="84" y="495">floor / wheel contact — base_link sits 0.02617 above it</text>

<!-- wheels -->
<circle cx="186.6" cy="452" r="27.4" fill="none" stroke="#6b7280" stroke-width="1.3"/>
<circle cx="413.4" cy="452" r="27.4" fill="none" stroke="#6b7280" stroke-width="1.3"/>

<!-- hull -->
<rect class="part" x="130.6" y="369.2" width="335.6" height="99.5" rx="6"/>
<!-- deck plate -->
<rect class="deck" x="130.8" y="371.5" width="335.0" height="8.5"/>
<!-- riser diamond (edge-on) -->
<rect x="174.5" y="365.6" width="251" height="25.2" fill="none" stroke="#8aa0b8" stroke-width="1" stroke-dasharray="3 3"/>
<text class="monod" x="228" y="358">riser diamond 0.493 sq @45°, z 0.220–0.290</text>

<!-- lidars -->
<rect class="sens" x="427.0" y="380.4" width="23.2" height="25.2"/>
<rect class="sens" x="149.8" y="380.4" width="23.1" height="25.2"/>
<text class="lbl" x="438" y="422" text-anchor="middle">lidar</text>
<text class="lbl" x="161" y="422" text-anchor="middle">lidar</text>

<!-- laser plane -->
<line class="ref" x1="100" y1="388.5" x2="620" y2="388.5"/>
<text class="mono" x="624" y="392">laser plane z = 0.2264</text>

<!-- mast -->
<rect class="mast" x="363.6" y="75.8" width="13.5" height="293.4"/>
<!-- standoff bracket -->
<rect x="377.1" y="92.2" width="16.1" height="10.8" fill="#1b1d22" stroke="#1b1d22" stroke-width="0.8"/>
<!-- camera -->
<rect class="sens" x="393.2" y="92.4" width="9.4" height="10.4"/>
<text class="lbl" x="412" y="86">D455</text>
<text class="monod" x="412" y="100">bracketed to the mast's FRONT face</text>
<text class="monod" x="412" y="114">44.7 mm black standoff — not top-mounted</text>
<text class="monod" x="412" y="128">mast runs 50 mm past the camera top</text>

<!-- height dimensions on the left -->
<line class="dim" x1="100" y1="479" x2="100" y2="102.8"/>
<line class="ref" x1="100" y1="102.8" x2="393.2" y2="102.8"/>
<text class="mono" x="96" y="300" text-anchor="end">1.0200</text>
<text class="monod" x="96" y="314" text-anchor="end">camera bottom</text>

<line class="dim" x1="70" y1="479" x2="70" y2="75.8"/>
<line class="ref" x1="70" y1="75.8" x2="363.6" y2="75.8"/>
<text class="mono" x="66" y="200" text-anchor="end">1.0950</text>
<text class="monod" x="66" y="214" text-anchor="end">mast top</text>

<line class="dim" x1="500" y1="479" x2="500" y2="369.2"/>
<line class="ref" x1="466.2" y1="369.2" x2="504" y2="369.2"/>
<text class="mono" x="508" y="424">0.2800 deck top</text>
<text class="monod" x="508" y="438">default_mount = 0.2950</text>

<line class="dim" x1="540" y1="479" x2="540" y2="388.5"/>
<text class="mono" x="548" y="470">0.2264</text>

<!-- x dimensions -->
<line class="dim" x1="300" y1="510" x2="441.2" y2="510"/>
<line class="ref" x1="441.2" y1="405.6" x2="441.2" y2="513"/>
<line class="ref" x1="300" y1="470" x2="300" y2="513"/>
<text class="mono" x="370" y="524" text-anchor="middle">+0.3922</text>

<line class="dim" x1="300" y1="538" x2="370.4" y2="538"/>
<line class="ref" x1="370.4" y1="369" x2="370.4" y2="541"/>
<text class="mono" x="335" y="552" text-anchor="middle">+0.1955 mast</text>

<line class="dim" x1="300" y1="566" x2="397.8" y2="566"/>
<line class="ref" x1="397.8" y1="103" x2="397.8" y2="569"/>
<text class="mono" x="349" y="580" text-anchor="middle">+0.2716 camera</text>

<!-- base_link marker -->
<circle cx="300" cy="470" r="3.6" fill="#16181d"/>
<text class="lbl" x="306" y="466">base_link (0,0,0)</text>

<!-- ================= PLAN VIEW ================= -->
<text class="ttl" x="24" y="626">PLAN VIEW  (+X forward →, +Y left ↑)</text>

<!-- hull -->
<rect class="part" x="140" y="565.4" width="317" height="269.2" rx="22"/>
<!-- riser diamond -->
<polygon points="418.5,700 300,581.5 181.5,700 300,818.5" fill="none" stroke="#8aa0b8" stroke-width="1" stroke-dasharray="3 3"/>
<!-- centreline -->
<line class="ref" x1="120" y1="700" x2="500" y2="700"/>

<!-- lidars -->
<rect class="sens" x="425" y="691.5" width="17" height="17"/>
<rect class="sens" x="158" y="691.5" width="17" height="17"/>
<!-- mast -->
<rect class="mast" x="360.1" y="693.6" width="12.8" height="12.8"/>
<!-- camera -->
<rect class="sens" x="388.1" y="678.9" width="8.8" height="42.2"/>

<text class="monod" x="433" y="686" text-anchor="middle">front lidar</text>
<text class="monod" x="166" y="686" text-anchor="middle">rear lidar (yaw 180°)</text>

<!-- width dim -->
<line class="dim" x1="510" y1="565.4" x2="510" y2="834.6"/>
<line class="ref" x1="457" y1="565.4" x2="514" y2="565.4"/>
<line class="ref" x1="457" y1="834.6" x2="514" y2="834.6"/>
<text class="mono" x="518" y="696">0.7932 wide</text>
<text class="monod" x="518" y="710">matches the 793 mm spec</text>

<!-- length dim -->
<line class="dim" x1="140" y1="862" x2="457" y2="862"/>
<text class="mono" x="298" y="876" text-anchor="middle">0.9325 long  (x −0.4706 … +0.4618)</text>

<!-- notes -->
<rect x="580" y="596" width="278" height="312" rx="6" fill="#f5f6f8" stroke="#e2e5e9"/>
<text class="lbl" x="596" y="620">Mounting notes</text>
<text class="monod" x="596" y="644">lidar2d_0_laser  (+0.3922, 0, 0.2264)</text>
<text class="monod" x="596" y="660">lidar2d_1_laser  (−0.3922, 0, 0.2264)</text>
<text class="monod" x="596" y="676">D455 bottom       z 1.0200, x +0.2716</text>
<text class="monod" x="596" y="692">mast 37.5 mm sq   x +0.1955, y 0</text>
<text class="monod" x="596" y="708">mast spans z      0.280 → 1.095</text>
<text class="monod" x="596" y="724">standoff          44.7 mm, black</text>
<text class="monod" x="596" y="740">D455 body         124 x 26 x 29 mm</text>

<text class="sub" x="596" y="756">Both lidars are coplanar and recessed in</text>
<text class="sub" x="596" y="770">the body notch — they are NOT deck-</text>
<text class="sub" x="596" y="784">mounted. Casings span z 0.179–0.249,</text>
<text class="sub" x="596" y="798">origin at the unit's base, laser +0.0474</text>
<text class="sub" x="596" y="812">above it.</text>

<text class="sub" x="596" y="834">Mast base clears the scan plane by</text>
<text class="sub" x="596" y="850">53.6 mm. The flared base plate is not</text>
<text class="sub" x="596" y="866">modelled, so real clearance is smaller.</text>

<text class="sub" x="596" y="884">Verified: 0/1081 self-returns, ±135°.</text>
</svg>
