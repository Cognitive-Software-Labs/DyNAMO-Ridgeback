<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 304" width="780" height="304" role="img" aria-labelledby="title desc">
  <title id="title">Commissioning guard test-permit budget</title>
  <desc id="desc">Nominal timeline of the guard's test-permit mode. The first accepted true permit while the physical stop is released opens a one-second budget. Capped commands pass only inside the budget. Afterwards the guard publishes zeros and asserts the mux lock at its next 20 Hz watchdog tick, even though true heartbeats continue.</desc>
  <style>
    .row { fill: #6e7781; font-weight: 600; font-size: 13px; font-family: sans-serif; }
    .note { fill: #6e7781; font-size: 12px; font-family: sans-serif; }
    .bar { fill: #ffffff; font-weight: 600; font-size: 12px; font-family: sans-serif; }
    .axis { stroke: #8c959f; stroke-width: 1.2; fill: none; }
    .guide { stroke: #8c959f; stroke-width: 1; stroke-dasharray: 4 4; fill: none; }
    .open { fill: #1a7f37; }
    .cap { fill: #0969da; }
    .lock { fill: #cf222e; }
    .idle { fill: #6e7781; }
    .tick { stroke: #0969da; stroke-width: 2; }
    .late { stroke: #8c959f; stroke-width: 2; }
  </style>

  <!-- guides at t = 0 and t = 1.0 s (x = 200 + 400 t) -->
  <line class="guide" x1="200" y1="36" x2="200" y2="258"/>
  <line class="guide" x1="600" y1="36" x2="600" y2="258"/>

  <!-- physical stop -->
  <text class="row" x="10" y="62">Physical stop</text>
  <rect class="open" x="120" y="48" width="640" height="18" rx="3"/>
  <text class="bar" x="440" y="61" text-anchor="middle">released by the operator</text>

  <!-- permit heartbeats -->
  <text class="row" x="10" y="104">Test permits</text>
  <g class="tick">
    <line x1="200" y1="90" x2="200" y2="108"/><line x1="220" y1="90" x2="220" y2="108"/>
    <line x1="240" y1="90" x2="240" y2="108"/><line x1="260" y1="90" x2="260" y2="108"/>
    <line x1="280" y1="90" x2="280" y2="108"/><line x1="300" y1="90" x2="300" y2="108"/>
    <line x1="320" y1="90" x2="320" y2="108"/><line x1="340" y1="90" x2="340" y2="108"/>
    <line x1="360" y1="90" x2="360" y2="108"/><line x1="380" y1="90" x2="380" y2="108"/>
    <line x1="400" y1="90" x2="400" y2="108"/><line x1="420" y1="90" x2="420" y2="108"/>
    <line x1="440" y1="90" x2="440" y2="108"/><line x1="460" y1="90" x2="460" y2="108"/>
    <line x1="480" y1="90" x2="480" y2="108"/><line x1="500" y1="90" x2="500" y2="108"/>
    <line x1="520" y1="90" x2="520" y2="108"/><line x1="540" y1="90" x2="540" y2="108"/>
    <line x1="560" y1="90" x2="560" y2="108"/><line x1="580" y1="90" x2="580" y2="108"/>
    <line x1="600" y1="90" x2="600" y2="108"/>
  </g>
  <g class="late">
    <line x1="620" y1="90" x2="620" y2="108"/><line x1="640" y1="90" x2="640" y2="108"/>
    <line x1="660" y1="90" x2="660" y2="108"/><line x1="680" y1="90" x2="680" y2="108"/>
    <line x1="700" y1="90" x2="700" y2="108"/>
  </g>
  <text class="note" x="206" y="84">true heartbeats, each valid for 0.2 s</text>
  <text class="note" x="606" y="84">later ones are ignored</text>

  <!-- permit budget -->
  <text class="row" x="10" y="146">Permit budget</text>
  <rect class="cap" x="200" y="132" width="400" height="18" rx="3"/>
  <text class="bar" x="400" y="145" text-anchor="middle">one second from the first accepted permit</text>
  <rect class="idle" x="600" y="132" width="160" height="18" rx="3"/>
  <text class="bar" x="680" y="145" text-anchor="middle">cannot be extended</text>

  <!-- guard output -->
  <text class="row" x="10" y="188">Guard output</text>
  <rect class="idle" x="120" y="174" width="80" height="18" rx="3"/>
  <text class="bar" x="160" y="187" text-anchor="middle">zeros</text>
  <rect class="cap" x="200" y="174" width="400" height="18" rx="3"/>
  <text class="bar" x="400" y="187" text-anchor="middle">capped commands: 0.05 m/s planar, 0.1 rad/s yaw</text>
  <rect class="idle" x="600" y="174" width="160" height="18" rx="3"/>
  <text class="bar" x="680" y="187" text-anchor="middle">zeros only</text>
  <text class="note" x="606" y="206">lock and zero at the next</text>
  <text class="note" x="606" y="219">watchdog tick, at most 50 ms</text>

  <!-- mux lock relay -->
  <text class="row" x="10" y="238">Mux lock relay</text>
  <rect class="lock" x="120" y="224" width="80" height="18" rx="3"/>
  <text class="bar" x="160" y="237" text-anchor="middle">asserted</text>
  <rect class="open" x="200" y="224" width="400" height="18" rx="3"/>
  <text class="bar" x="400" y="237" text-anchor="middle">released</text>
  <rect class="lock" x="600" y="224" width="160" height="18" rx="3"/>
  <text class="bar" x="680" y="237" text-anchor="middle">asserted</text>

  <!-- time axis -->
  <line class="axis" x1="120" y1="258" x2="760" y2="258"/>
  <line class="axis" x1="200" y1="258" x2="200" y2="264"/>
  <line class="axis" x1="400" y1="258" x2="400" y2="264"/>
  <line class="axis" x1="600" y1="258" x2="600" y2="264"/>
  <text class="note" x="200" y="278" text-anchor="middle">0 s</text>
  <text class="note" x="400" y="278" text-anchor="middle">0.5 s</text>
  <text class="note" x="600" y="278" text-anchor="middle">1.0 s</text>
  <text class="note" x="10" y="298">Nominal behaviour, not a measured trace. Pressing the physical stop resets the budget for the next cycle.</text>
</svg>
