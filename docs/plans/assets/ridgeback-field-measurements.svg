<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
  <title id="title">A tape-and-photo guide to the Ridgeback sensor mounts</title>
  <desc id="desc">Schematic side and top views, front to the right. A measures floor to deck top, B deck top to camera housing bottom, C floor to a photographed point on each LiDAR window, D camera housing front face to deck front edge, and E each LiDAR housing's outward face to the nearest body edge. No dimensions or physical calibration results are asserted.</desc>
  <!-- Hand-authored procedural schematic. The referenced plan owns A–E.
       Illustrative geometry only; not generated from a robot model or measurement. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="forward" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", sans-serif; fill: #1e293b; }
      .title { font-size: 26px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; }
      .label { font-size: 15px; }
      .small { font-size: 13px; fill: #64748b; }
      .code { font-size: 18px; font-weight: 700; fill: #2563eb; }
      .card { fill: #fff; stroke: #dce4ef; stroke-width: 1.5; }
      .body { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; }
      .sensor { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .extension { stroke: #93b4e8; stroke-width: 1.3; stroke-dasharray: 4 4; }
      .dimension { stroke: #2563eb; stroke-width: 1.8; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="850" fill="#f4f7fc"/>
  <text class="title" x="28" y="44">A few useful readings, not a whole-robot survey</text>
  <text class="label" x="28" y="73">Tape + phone · accessible housing points · front is to the right in both views</text>

  <rect class="card" x="24" y="100" width="620" height="466" rx="16"/>
  <text class="heading" x="46" y="133">Side view · heights</text>
  <text class="small" x="46" y="157">Mark the exact tape endpoint in a photo.</text>

  <!-- Floor and body; wheels provide orientation only. -->
  <line x1="95" y1="501" x2="614" y2="501" stroke="#475569" stroke-width="2"/>
  <circle cx="255" cy="483" r="18" fill="#64748b"/>
  <circle cx="515" cy="483" r="18" fill="#64748b"/>
  <rect class="body" x="210" y="394" width="360" height="86" rx="12"/>
  <rect x="210" y="389" width="360" height="9" rx="3" fill="#94a3b8" stroke="#64748b"/>
  <text class="small" x="236" y="379">deck top</text>
  <text class="small" x="253" y="527">floor · not the base_link origin</text>

  <!-- Mast, standoff, and D455 housing. B ends at the housing underside. -->
  <rect x="410" y="185" width="16" height="204" rx="2" fill="#b7c3d3" stroke="#64748b" stroke-width="2"/>
  <rect x="426" y="211" width="15" height="10" fill="#64748b"/>
  <rect class="sensor" x="441" y="198" width="29" height="30" rx="3"/>
  <text class="label" x="480" y="218">D455</text>
  <line class="extension" x1="349" y1="228" x2="470" y2="228"/>
  <line class="dimension" x1="357" y1="232" x2="357" y2="385"/>
  <text class="code" x="331" y="316">B</text>

  <!-- LiDAR housing/window points are visibly identifiable, not optical origins. -->
  <rect class="sensor" x="223" y="429" width="31" height="25" rx="3"/>
  <line x1="225" y1="442" x2="252" y2="442" stroke="#2563eb" stroke-width="3"/>
  <rect class="sensor" x="522" y="419" width="31" height="25" rx="3"/>
  <line x1="524" y1="432" x2="551" y2="432" stroke="#2563eb" stroke-width="3"/>
  <text class="small" x="217" y="419">rear</text>
  <text class="small" x="513" y="409">front</text>
  <line class="extension" x1="176" y1="442" x2="223" y2="442"/>
  <line class="dimension" x1="182" y1="446" x2="182" y2="497"/>
  <text class="code" x="153" y="478">C</text>

  <line class="extension" x1="571" y1="389" x2="608" y2="389"/>
  <line class="dimension" x1="594" y1="393" x2="594" y2="497"/>
  <text class="code" x="607" y="454">A</text>
  <text class="small" x="46" y="551">Repeat C at both LiDARs; their equal height is not assumed.</text>

  <rect class="card" x="664" y="100" width="432" height="466" rx="16"/>
  <text class="heading" x="686" y="133">Top view · setbacks</text>
  <text class="small" x="686" y="157">Use a visible deck/body edge as the datum.</text>
  <rect class="body" x="734" y="228" width="292" height="202" rx="20"/>
  <line x1="719" y1="329" x2="1036" y2="329" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="909" y="320" width="17" height="18" fill="#b7c3d3" stroke="#64748b"/>
  <rect class="sensor" x="933" y="308" width="15" height="42" rx="2"/>
  <text class="small" x="888" y="296">camera</text>
  <rect class="sensor" x="759" y="317" width="21" height="24" rx="2"/>
  <rect class="sensor" x="980" y="317" width="21" height="24" rx="2"/>
  <text class="small" x="754" y="365">rear</text>
  <text class="small" x="977" y="365">front</text>

  <!-- D: camera front face to deck front edge, measured horizontally. -->
  <line class="extension" x1="948" y1="195" x2="948" y2="308"/>
  <line class="extension" x1="1026" y1="195" x2="1026" y2="228"/>
  <line class="dimension" x1="952" y1="204" x2="1022" y2="204"/>
  <text class="code" x="980" y="191">D</text>

  <!-- E: outward housing face to the nearest outer body edge, each end. -->
  <line class="extension" x1="734" y1="430" x2="734" y2="464"/>
  <line class="extension" x1="759" y1="342" x2="759" y2="464"/>
  <line class="dimension" x1="736" y1="455" x2="757" y2="455"/>
  <text class="code" x="740" y="486">E</text>
  <line class="extension" x1="1001" y1="342" x2="1001" y2="464"/>
  <line class="extension" x1="1026" y1="430" x2="1026" y2="464"/>
  <line class="dimension" x1="1003" y1="455" x2="1024" y2="455"/>
  <text class="code" x="1007" y="486">E</text>
  <line x1="1043" y1="329" x2="1080" y2="329" stroke="#475569" stroke-width="2" marker-end="url(#forward)"/>
  <text class="small" x="1043" y="353">front</text>
  <text class="small" x="686" y="524">Camera looks centred? A photo is enough.</text>
  <text class="small" x="686" y="545">Measure a lateral offset only if visibly off-centre.</text>

  <rect class="card" x="24" y="586" width="1072" height="210" rx="16"/>
  <text class="heading" x="46" y="620">Heights</text>
  <text class="label" x="46" y="652"><tspan fill="#2563eb" font-weight="700">A</tspan><tspan dx="14">Floor → deck top</tspan></text>
  <text class="label" x="46" y="683"><tspan fill="#2563eb" font-weight="700">B</tspan><tspan dx="14">Deck top → camera housing bottom</tspan></text>
  <text class="label" x="46" y="714"><tspan fill="#2563eb" font-weight="700">C</tspan><tspan dx="14">Floor → photographed point on each LiDAR</tspan></text>
  <text class="small" x="46" y="760">A + B gives the camera housing-bottom height above the floor.</text>

  <line x1="574" y1="609" x2="574" y2="772" stroke="#dce4ef"/>
  <text class="heading" x="600" y="620">Placement</text>
  <text class="label" x="600" y="652"><tspan fill="#2563eb" font-weight="700">D</tspan><tspan dx="14">Camera front face → deck front edge</tspan></text>
  <text class="label" x="600" y="683"><tspan fill="#2563eb" font-weight="700">E</tspan><tspan dx="14">LiDAR outward face → nearest body edge</tspan></text>
  <text class="small" x="600" y="730">Record units and approximate precision.</text>
  <text class="small" x="600" y="752">An inaccessible point can stay unknown; photograph it.</text>
  <text class="small" x="28" y="825">Schematic only · letters mark tape endpoints · housing points are not calibrated optical or laser origins</text>
</svg>
