# Full coverage scenario set: every axis, 5 examples each with different poses.
#   A. single robot            (single_*)   -- baseline, varied x/y/yaw
#   B. multiple robots visible (multi_*)    -- instance count, laterally separated
#   C. inter-robot occlusion   (interocc_*) -- 2 robots on the SAME bearing, far occluded
#   D. object NOT occluding    (objclear_*) -- object off to the side, robot clear
#   E. object occluding        (objocc_*)   -- object on the robot's bearing, in front
#
# World-frame planar: x = forward, y = lateral (+left). yaw about +Z (rad).
# 25 scenes; a full repeats=1 run is ~25 trials.
defaults:
  robot_yaw_rad: 3.141592653589793

scenes:
  # ---- A. Single robot (varied pose + yaw) ----
  - id: single_01
    robots: [{ x: 1.5, y: 0.0 }]
  - id: single_02
    robots: [{ x: 2.5, y: -0.75 }]
  - id: single_03
    robots: [{ x: 3.5, y: 0.75, yaw: 2.60 }]
  - id: single_04
    robots: [{ x: 4.5, y: -0.5, yaw: 3.50 }]
  - id: single_05
    robots: [{ x: 5.5, y: 0.4, yaw: 2.90 }]

  # ---- B. Multiple robots, all visible (laterally separated) ----
  - id: multi_01
    robots:
      - { x: 3.0, y: -0.9 }
      - { x: 3.0, y: 0.9 }
  - id: multi_02
    robots:
      - { x: 2.5, y: -1.0 }
      - { x: 2.5, y: 1.0 }
  - id: multi_03
    robots:
      - { x: 3.5, y: -1.2 }
      - { x: 3.5, y: 0.0 }
      - { x: 3.5, y: 1.2 }
  - id: multi_04
    robots:
      - { x: 2.0, y: -0.7, yaw: 3.40 }
      - { x: 4.0, y: 0.8, yaw: 2.80 }
  - id: multi_05
    robots:
      - { x: 3.0, y: -1.1 }
      - { x: 2.6, y: 0.0 }
      - { x: 3.4, y: 1.1 }

  # ---- C. Inter-robot occlusion (near/far on the same bearing) ----
  - id: interocc_01
    robots:
      - { x: 2.0, y: 0.0 }
      - { x: 4.0, y: 0.0 }
  - id: interocc_02
    robots:
      - { x: 2.0, y: 0.5 }
      - { x: 4.0, y: 1.0 }
  - id: interocc_03
    robots:
      - { x: 1.5, y: -0.3 }
      - { x: 3.0, y: -0.6 }
  - id: interocc_04
    robots:
      - { x: 2.5, y: 0.0, yaw: 2.80 }
      - { x: 4.5, y: 0.0, yaw: 3.30 }
  - id: interocc_05
    robots:
      - { x: 1.8, y: 0.45 }
      - { x: 3.6, y: 0.90 }

  # ---- D. Object present but NOT occluding (off to the side; varied object yaw) ----
  - id: objclear_01
    robots: [{ x: 3.0, y: 0.0 }]
    objects: [{ model: hospital_bed, x: 2.5, y: 1.3, yaw: 0.0 }]
  - id: objclear_02
    robots: [{ x: 2.5, y: 0.3 }]
    objects: [{ model: hospital_bed, x: 2.0, y: -1.3, yaw: 0.785 }]     # 45 deg
  - id: objclear_03
    robots: [{ x: 3.5, y: -0.4, yaw: 2.90 }]
    objects: [{ model: privacy_curtain, x: 2.8, y: 1.4, yaw: 1.5708 }]  # 90 deg
  - id: objclear_04
    robots: [{ x: 4.0, y: 0.2 }]
    objects: [{ model: hospital_bed, x: 3.0, y: -1.6, yaw: 1.5708 }]
  - id: objclear_05
    robots: [{ x: 2.2, y: 0.5, yaw: 3.30 }]
    objects: [{ model: hospital_bed, x: 2.4, y: 1.5, yaw: 2.356 }]      # 135 deg

  # ---- E. Object occluding the robot (same bearing, in front) ----
  # Object yaw tunes coverage: bed 1.5708 = broadside (max block), 0 = narrow
  # (long axis toward camera); curtain 0 = wide barrier, 1.5708 = edge-on sliver.
  - id: objocc_01
    robots: [{ x: 3.5, y: 0.0 }]
    objects: [{ model: hospital_bed, x: 2.2, y: 0.0, yaw: 1.5708 }]     # broadside bed
  - id: objocc_02
    robots: [{ x: 3.0, y: 0.0 }]
    objects: [{ model: privacy_curtain, x: 1.8, y: 0.0, yaw: 0.0 }]     # wide curtain, near-full
  - id: objocc_03
    robots: [{ x: 4.0, y: 0.5 }]
    objects: [{ model: hospital_bed, x: 2.4, y: 0.30, yaw: 0.785 }]     # angled bed
  - id: objocc_04
    robots: [{ x: 3.2, y: -0.48 }]
    objects: [{ model: hospital_bed, x: 2.0, y: -0.30, yaw: 0.0 }]      # narrow bed (long axis at camera)
  - id: objocc_05
    robots: [{ x: 3.8, y: 0.0, yaw: 3.00 }]
    objects: [{ model: privacy_curtain, x: 2.3, y: 0.0, yaw: 0.4 }]

  # ---- F. Object PARTIALLY occluding (robot stays >= half visible) ----
  # Vertical partial: a low bed in front leaves the upper body visible.
  # Lateral partial: the occluder is offset so it clips only part of the width.
  - id: objpartial_01
    robots: [{ x: 3.5, y: 0.0 }]
    objects: [{ model: hospital_bed, x: 2.2, y: 0.0 }]        # low bed centered -> lower body only, head+torso visible
  - id: objpartial_02
    robots: [{ x: 3.5, y: 0.0 }]
    objects: [{ model: hospital_bed, x: 2.3, y: -0.45 }]      # offset left -> ~left half occluded
  - id: objpartial_03
    robots: [{ x: 3.5, y: 0.0 }]
    objects: [{ model: hospital_bed, x: 2.3, y: 0.55 }]       # offset right -> mostly visible
  - id: objpartial_04
    robots: [{ x: 3.0, y: 0.0 }]
    objects: [{ model: privacy_curtain, x: 2.0, y: -0.7 }]    # tall curtain offset -> left side (incl upper) blocked
  - id: objpartial_05
    robots: [{ x: 4.0, y: 0.0 }]
    objects: [{ model: hospital_bed, x: 2.6, y: 0.6, yaw: 1.5708 }]  # broadside bed offset -> partial from the right     # curtain slightly angled
