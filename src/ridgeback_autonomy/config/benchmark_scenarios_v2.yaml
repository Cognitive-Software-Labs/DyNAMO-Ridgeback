  # privacy_curtain heavy occlusion; vis 0.14 (band 0.02-0.20)
  - id: objocc_heavy_04
    robots: [{ x: 4.12, y: -0.48, yaw: 3.17 }]
    objects:
      - { model: privacy_curtain, x: 2.27, y: 0.4, yaw: 0.44 }

  # hospital_bed partial; vis 0.65 (band 0.35-0.65)
  - id: objpartial_01
    robots: [{ x: 4.41, y: 0.31, yaw: 3.62 }]
    objects:
      - { model: hospital_bed, x: 3.3, y: -0.12, yaw: 0.61 }
