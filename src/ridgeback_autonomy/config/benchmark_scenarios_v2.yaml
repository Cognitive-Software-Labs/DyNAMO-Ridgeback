# v2 benchmark set: randomized poses under family constraints, pixel-certified
# (id-buffer raster through sim intrinsics fx=443.53, 640x480, camera at
# (0.25, 0, 0.85)). Sampler seed 20260725, generated 2026-07-26 by a one-shot
# scratchpad script; this YAML is the durable artifact. Comments carry the
# certified visible fractions measured at generation time.
#
# Design: repeats:=1 at the runner; 3 probe scenes carry repeats_override 8
# to measure the within-pose noise floor (single_facing_01, objpartial_01,
# far_mid_01). Yaw and occluder shape are stratified factors; occlusion and
# FOV families are certified into named bands.
#
# World-frame planar: x = forward, y = lateral (+left). yaw about +Z (rad).
defaults:
  robot_yaw_rad: 3.141592653589793

scenes:
  # yaw stratum facing
  - id: single_facing_01
    robots: [{ x: 5.02, y: -1.11, yaw: 2.78 }]
    repeats_override: 8

  # yaw stratum facing
  - id: single_facing_02
    robots: [{ x: 4.27, y: -0.14, yaw: 3.46 }]

  # yaw stratum side
  - id: single_side_01
    robots: [{ x: 2.42, y: -0.81, yaw: 5.0 }]

  # yaw stratum side
  - id: single_side_02
    robots: [{ x: 4.94, y: -1.41, yaw: 4.54 }]

  # yaw stratum back
  - id: single_back_01
    robots: [{ x: 1.94, y: 0.32, yaw: 0.07 }]

  # yaw stratum back
  - id: single_back_02
    robots: [{ x: 4.83, y: 1.42, yaw: 0.11 }]

  # yaw stratum free
  - id: single_free_01
    robots: [{ x: 3.71, y: 1.18, yaw: 5.95 }]

  # yaw stratum free
  - id: single_free_02
    robots: [{ x: 5.17, y: 1.91, yaw: 2.67 }]

  # 2 robots all visible: 1.00, 1.00
  - id: multi_01
    robots:
      - { x: 1.82, y: 0.2, yaw: 3.28 }
      - { x: 3.67, y: -1.18, yaw: 6.05 }

  # 3 robots all visible: 1.00, 1.00, 0.98
  - id: multi_02
    robots:
      - { x: 3.45, y: -1.05, yaw: 3.44 }
      - { x: 2.44, y: 0.87, yaw: 2.77 }
      - { x: 4.36, y: 0.88, yaw: 3.16 }

  # 2 robots all visible: 0.98, 1.00
  - id: multi_03
    robots:
      - { x: 4.11, y: 0.1, yaw: 3.08 }
      - { x: 2.42, y: -0.33, yaw: 3.38 }

  # 3 robots all visible: 1.00, 1.00, 1.00
  - id: multi_04
    robots:
      - { x: 4.23, y: -0.1, yaw: 2.92 }
      - { x: 3.48, y: 0.76, yaw: 2.96 }
      - { x: 5.41, y: 2.46, yaw: 3.2 }

  # shoulder gap 0.14 m, mask-merge risk
  - id: twin_shoulder_01
    robots:
      - { x: 4.01, y: -0.35, yaw: 2.82 }
      - { x: 4.01, y: 0.29, yaw: 3.17 }

  # shoulder gap 0.11 m, mask-merge risk
  - id: twin_shoulder_02
    robots:
      - { x: 3.13, y: -0.76, yaw: 3.28 }
      - { x: 3.13, y: -0.15, yaw: 3.1 }

  # bearing-adjacent, range-separated
  - id: twin_swap_01
    robots:
      - { x: 2.35, y: 0.24, yaw: 3.25 }
      - { x: 4.01, y: -0.13, yaw: 3.62 }

  # bearing-adjacent, range-separated
  - id: twin_swap_02
    robots:
      - { x: 2.66, y: 0.75, yaw: 2.87 }
      - { x: 4.45, y: 0.21, yaw: 3.48 }

  # far robot vis 0.15 (band 0.15-0.45)
  - id: interocc_moderate_01
    robots:
      - { x: 3.07, y: -0.75, yaw: 3.18 }
      - { x: 4.69, y: -0.97, yaw: 2.86 }

  # far robot vis 0.23 (band 0.15-0.45)
  - id: interocc_moderate_02
    robots:
      - { x: 1.87, y: 0.11, yaw: 2.76 }
      - { x: 3.91, y: 0.69, yaw: 2.99 }

  # far robot vis 0.09 (band 0.03-0.15)
  - id: interocc_sliver_01
    robots:
      - { x: 3.21, y: -0.66, yaw: 2.72 }
      - { x: 4.76, y: -1.14, yaw: 3.61 }

  # far robot vis 0.10 (band 0.03-0.15)
  - id: interocc_sliver_02
    robots:
      - { x: 3.04, y: -0.94, yaw: 2.7 }
      - { x: 4.09, y: -1.18, yaw: 3.49 }

  # far robot vis 0.00 (band 0.0-0.03)
  - id: interocc_neartotal_01
    robots:
      - { x: 3.02, y: -0.12, yaw: 3.0 }
      - { x: 5.1, y: -0.31, yaw: 3.43 }

  # far robot vis 0.00 (band 0.0-0.03)
  - id: interocc_neartotal_02
