    objects:
      - { model: table, x: 2.57, y: -0.93, yaw: 1.57 }

  # table in front + cabinet behind: depth band attacked both sides; vis 0.62
  - id: trap_layered_01
    robots: [{ x: 3.71, y: -1.27, yaw: 2.76 }]
