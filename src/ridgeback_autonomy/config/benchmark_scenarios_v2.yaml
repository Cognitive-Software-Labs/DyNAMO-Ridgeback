  # privacy_curtain heavy occlusion; vis 0.16 (band 0.02-0.20)
  - id: objocc_heavy_01
    robots: [{ x: 3.34, y: 0.95, yaw: 3.13 }]
    objects:
      - { model: privacy_curtain, x: 2.17, y: 0.04, yaw: 2.67 }

  # cabinet heavy occlusion; vis 0.05 (band 0.02-0.20)
  - id: objocc_heavy_02
