      - { model: table, x: 2.96, y: -0.89, yaw: 2.38 }

  # near limit, centered: feet clipped by VFOV
  - id: near_clip_01
    robots: [{ x: 1.34, y: -0.03, yaw: 3.45 }]

  # near limit + lateral + rotated
  - id: near_clip_02
    robots: [{ x: 1.36, y: -0.67, yaw: 0.65 }]

  # near limit + lateral + rotated
  - id: near_clip_03
    robots: [{ x: 1.09, y: 0.03, yaw: 3.28 }]

  # small target, depth noise region
  - id: far_mid_01
    robots: [{ x: 8.06, y: -1.56, yaw: 3.22 }]
    repeats_override: 8

  # small target, depth noise region
  - id: far_mid_02
    robots: [{ x: 7.64, y: -0.43, yaw: 2.64 }]

  # just inside the 10 m depth clamp
  - id: far_clamp_01
    robots: [{ x: 9.18, y: -2.79, yaw: 3.6 }]

  # just inside the 10 m depth clamp
  - id: far_clamp_02
    robots: [{ x: 9.32, y: 0.44, yaw: 3.18 }]

  # BEYOND the depth clamp: depth paths must miss
  - id: far_beyond_01
    robots: [{ x: 10.73, y: 0.64, yaw: 3.41 }]

  # center ratio 0.89; in-frame 1.00
  - id: edge_mostly_in_01
    robots: [{ x: 4.39, y: -2.67, yaw: 2.74 }]

  # center ratio 0.88; in-frame 1.00
  - id: edge_mostly_in_02
    robots: [{ x: 3.98, y: 2.38, yaw: 2.8 }]

  # center ratio 1.04; in-frame 0.26
  - id: edge_half_out_01
    robots: [{ x: 4.3, y: 3.03, yaw: 3.48 }]

  # center ratio 1.03; in-frame 0.27
  - id: edge_half_out_02
    robots: [{ x: 4.37, y: -3.08, yaw: 2.79 }]

  # center ratio 1.18; in-frame 0.01
  - id: edge_sliver_01
    robots: [{ x: 2.67, y: 2.05, yaw: 3.44 }]

  # edge-on curtain bisects mask (verified); vis 0.30
  - id: trap_split_curtain
    robots: [{ x: 3.86, y: 0.17, yaw: 3.04 }]
    objects:
      - { model: privacy_curtain, x: 2.35, y: 0.11, yaw: 1.57 }

  # IV pole bisects mask (verified); vis 0.70
  - id: trap_split_pole
    robots: [{ x: 3.86, y: -0.48, yaw: 3.07 }]
    objects:
      - { model: iv_pole, x: 2.25, y: -0.24, yaw: 0.0 }

  # bed blocks scan plane fully; camera vis 0.84
  - id: trap_lidar_bed
    robots: [{ x: 4.19, y: -1.39, yaw: 3.21 }]
    objects:
      - { model: hospital_bed, x: 1.47, y: -0.43, yaw: 0.0 }

  # table on same bearing: scan passes between legs; camera vis 0.67
  - id: trap_lidar_table
