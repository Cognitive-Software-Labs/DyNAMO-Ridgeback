  - id: chaos_01
    robots:
      - { x: 4.17, y: -1.34, yaw: 1.18 }
      - { x: 3.7, y: 1.17, yaw: 4.27 }
      - { x: 4.53, y: -0.09, yaw: 3.2 }
    objects:
