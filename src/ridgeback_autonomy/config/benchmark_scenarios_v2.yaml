    objects:
      - { model: table, x: 3.57, y: 0.14, yaw: 0.11 }

  # cabinet at same range, lateral gap; vis 1.00
  - id: interfere_beside_02
    robots: [{ x: 3.81, y: 0.18, yaw: 2.9 }]
    objects:
      - { model: cabinet, x: 3.79, y: -1.0, yaw: 1.75 }

  # hospital_bed far behind, same bearing; vis 1.00
  - id: interfere_bearing_01
    robots: [{ x: 2.42, y: 0.34, yaw: 2.98 }]
    objects:
      - { model: hospital_bed, x: 5.31, y: 0.79, yaw: 0.8 }

  # hospital_bed_high far behind, same bearing; vis 1.00
  - id: interfere_bearing_02
    robots: [{ x: 2.68, y: -0.96, yaw: 3.47 }]
    objects:
      - { model: hospital_bed_high, x: 5.41, y: -2.04, yaw: 1.53 }

  # CONTROL/FP sweep: table_low clean separation; vis 1.00
  - id: interfere_control_01
    robots: [{ x: 4.3, y: -0.87, yaw: 3.46 }]
    objects:
      - { model: table_low, x: 3.26, y: 1.34, yaw: 2.35 }

