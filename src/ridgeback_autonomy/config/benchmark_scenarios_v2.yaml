  # hospital_bed_high partial; vis 0.50 (band 0.35-0.65)
  - id: objpartial_02
    robots: [{ x: 3.69, y: 1.61, yaw: 3.21 }]
    objects:
      - { model: hospital_bed_high, x: 2.37, y: 0.44, yaw: 0.06 }

  # privacy_curtain partial; vis 0.51 (band 0.35-0.65)
  - id: objpartial_03
    robots: [{ x: 3.11, y: -0.34, yaw: 3.35 }]
    objects:
      - { model: privacy_curtain, x: 2.22, y: -1.08, yaw: 0.16 }

  # table partial; vis 0.60 (band 0.35-0.65)
  - id: objpartial_04
