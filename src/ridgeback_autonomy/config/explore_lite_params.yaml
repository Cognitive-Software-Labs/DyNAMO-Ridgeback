/**/explore_node:
  ros__parameters:
    robot_base_frame: base_link
    costmap_topic: global_costmap/costmap
    costmap_updates_topic: global_costmap/costmap_updates
    visualize: true
    planner_frequency: 0.2
    progress_timeout: 60.0
    potential_scale: 5.0
    orientation_scale: 0.0
    gain_scale: 0.2
    transform_tolerance: 0.3
    min_frontier_size: 0.25
    # Genuine navigation failures required before a frontier is blacklisted.
    # Transient aborts (TF gaps, controller overload on a shared host) come in
    # bursts; a single abort must not permanently remove a frontier.
    abort_blacklist_threshold: 3
    return_to_init: true
