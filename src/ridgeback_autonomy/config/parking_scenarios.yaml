# Parking demo scenes (launch argument demo_scenario), spawned by
# parking_simulation_startup and read by tools/parking_scenarios for evaluation.
#
# Every scene is built around a workstation: G1 standing at a worktable, facing
# it, out of the robot's sight from its start (the backend's default spawn at the
# world origin, facing +x). The robot must explore to find G1. Objects are placed
# in the workstation frame: `forward` toward the worktable, `left` to G1's left when
# it faces the table, `yaw_deg` relative to the workstation heading. `g1_turn_deg`
# turns G1 away from the table. Assets are logical names from each backend's
# sim/benchmark_assets.yaml, so Gazebo and Isaac spawn the same collision geometry
# around G1. `expected` and `purpose` document intent; the mission never reads them,
# and nothing here is passed to the mission.
schema: ridgeback_parking_scenarios/2
workstations:
  # In the lane west of the start, facing west: behind the camera at the start; the
  # explorer heads down this lane first and meets G1 from behind, the view the
  # detector localizes reliably. Earlier layouts (2026-11-05/08, see the record): an
  # aisle behind the long shelf the explorer never entered; the floor north of the
  # start, where G1 was found before the robot left its spawn, so every route began
  # in the unscanned wedges beside its flanks and was rightly rejected; and the west
  # lane's edge, where a front-left view scored below the 0.50 localization floor.
  gz: {x: -4.5, y: -0.6, yaw_deg: 180}
  # The south room off the corridor, entered through the doorway at x 2.7-5.3; the
  # corridor wall hides G1 from the start (the robot arrives from G1's back-left).
  isaac: {x: 0.5, y: -4.5, yaw_deg: -90}
robot_start: {x: 0.0, y: 0.0, yaw_deg: 0.0}
scenarios:
  standard:
    description: G1 at its worktable, facing it, in a pick-and-place position
    purpose: the reference task; open floor on both sides of G1
    expected: parking on G1's left or right, never under the tabletop
    g1_turn_deg: 0
    objects:
      - {name: worktable, asset: table, forward: 0.75, left: 0.0, yaw_deg: 90}
  right_blocked:
    description: G1 at its worktable with a 1.7 m panel along its right side
    purpose: the preferred sides are unequal; one is blocked
    expected: parking on G1's left
    objects:
      - {name: worktable, asset: table, forward: 0.75, left: 0.0, yaw_deg: 90}
      - {name: right_panel, asset: privacy_curtain, forward: 0.0, left: -0.8, yaw_deg: 90}
  left_blocked:
    description: G1 at its worktable with a 1.7 m panel along its left side
    purpose: the mirror of right_blocked
    expected: parking on G1's right
    objects:
      - {name: worktable, asset: table, forward: 0.75, left: 0.0, yaw_deg: 90}
      - {name: left_panel, asset: privacy_curtain, forward: 0.0, left: 0.8, yaw_deg: 90}
  both_sides_blocked:
    description: G1 at its worktable between two panels, open behind it
    purpose: both preferred sides blocked; the next class (behind G1) must be used
    expected: parking behind G1
    objects:
      - {name: worktable, asset: table, forward: 0.75, left: 0.0, yaw_deg: 90}
      - {name: right_panel, asset: privacy_curtain, forward: 0.0, left: -0.8, yaw_deg: 90}
      - {name: left_panel, asset: privacy_curtain, forward: 0.0, left: 0.8, yaw_deg: 90}
  restricted:
    description: >-
      G1 at its worktable between two side tables whose tops the base fits under but
      the mast and basket do not, reached through a 2.1 m passage
    purpose: obstacles above the LiDAR plane; side poses would put the mast under a tabletop
    expected: parking behind G1; no pose under a tabletop
    objects:
      - {name: worktable, asset: table, forward: 0.75, left: 0.0, yaw_deg: 90}
      - {name: right_table, asset: table, forward: 0.0, left: -1.2, yaw_deg: 0}
      - {name: left_table, asset: table, forward: 0.0, left: 1.2, yaw_deg: 0}
      - {name: passage_right, asset: privacy_curtain, forward: -1.5, left: -1.1, yaw_deg: 90}
      - {name: passage_left, asset: privacy_curtain, forward: -1.5, left: 1.1, yaw_deg: 90}
  no_feasible:
    description: >-
      G1 at its worktable inside a pen: panels 0.8 m to each side and a 0.5 m bed
      behind it, low enough for the camera to see G1 over it
    purpose: G1 is detectable and localizable, but no robot footprint fits beside it
    expected: no parking manoeuvre; bounded planning, return to start with no_valid_candidate
    objects:
      - {name: worktable, asset: table, forward: 0.75, left: 0.0, yaw_deg: 90}
      - {name: right_panel, asset: privacy_curtain, forward: 0.0, left: -0.8, yaw_deg: 90}
      - {name: left_panel, asset: privacy_curtain, forward: 0.0, left: 0.8, yaw_deg: 90}
      - {name: rear_bed, asset: hospital_bed, forward: -1.25, left: 0.0, yaw_deg: 90}
  heading_90:
    description: G1 at its worktable but turned 90 deg to its left, the table on its right
    purpose: G1's sides rotate with it; its right side now faces the table
    expected: parking on G1's left; poses on its right would be under the tabletop
    g1_turn_deg: 90
    objects:
      - {name: worktable, asset: table, forward: 0.75, left: 0.0, yaw_deg: 90}
  heading_away:
    description: G1 turned away from its worktable, its back to the table
    purpose: G1 faces the way the robot arrives; the camera sees its front first
    expected: parking on G1's left or right; behind G1 is the table
    g1_turn_deg: 180
    objects:
      - {name: worktable, asset: table, forward: 0.75, left: 0.0, yaw_deg: 90}
