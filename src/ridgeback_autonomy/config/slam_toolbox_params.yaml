slam_toolbox:
  ros__parameters:
    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan  # overridden by launch via RewrittenYaml
    mode: mapping
    use_map_saver: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 0.5
    resolution: 0.05
    # UST-10LX (Isaac, P4) tops out at 10 m; was 20.0 for the idealized
    # gz "hokuyo" (360deg/25m). Keep <= the sensor's range_max.
    max_laser_range: 10.0
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    scan_queue_size: 10
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # Every-scan ingestion (0.0/0.0 + minimum_time_interval 0.2) measured
    # BEST on the closed-loop probe (tools/isaac/slam_quality_probe.py):
    # node density keeps the graph rigid and re-localizes at rest (loop
    # error 0.010 m, map IoU 0.74). Travel gating measured strictly worse
    # against the fixed sensor: 0.2 m/10 deg thins the map (IoU 0.37) and
    # lets the at-rest estimate go stale (loop error 0.31 m); 0.1 m/5 deg
    # left chains weak enough that one bad loop closure snapped the graph
    # 7.4 m mid-run.
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.0
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    # Stock default 0.8 (gz-era 0.1 accepted noise links). Measured on
    # identical seeded runs vs 0.1: map IoU 0.70 -> 0.74, wall precision
    # 0.74 -> 0.78, loop error 0.012 -> 0.010 m — small but consistent.
    link_match_minimum_response_fine: 0.8
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
