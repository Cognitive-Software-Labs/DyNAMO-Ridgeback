    format: sdf
    spawn_z_m: 0.05
  low_cabinet:
    resource: models/bg_low_cabinet/model.sdf
    format: sdf
    spawn_z_m: 0.05
  metal_cabinet:
    resource: models/bg_metal_cabinet/model.sdf
    format: sdf
    spawn_z_m: 0.05
  mobile_whiteboard:
    resource: models/bg_mobile_whiteboard/model.sdf
    format: sdf
    spawn_z_m: 0.05
  office_chair:
    resource: models/bg_office_chair/model.sdf
    format: sdf
    spawn_z_m: 0.05
  plant:
    resource: models/bg_plant/model.sdf
    format: sdf
    spawn_z_m: 0.05
  trash_bin:
    resource: models/bg_trash_bin/model.sdf
    format: sdf
    spawn_z_m: 0.05
  utility_cart:
    resource: models/bg_utility_cart/model.sdf
    format: sdf
    spawn_z_m: 0.05
  visitor_chair:
