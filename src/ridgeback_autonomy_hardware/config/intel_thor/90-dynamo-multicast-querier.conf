# Intel only: make br0 the IGMP querier of the robot Ethernet.
# Install as /etc/systemd/network/10-netplan-br0.netdev.d/90-dynamo-multicast-querier.conf
# (a drop-in for the netdev netplan generates; netplan cannot set this itself).
#
# Without a querier, IGMP snooping on the robot segment stops delivering a
# restarted host's DDS discovery multicast (239.255.0.1) to the other host
# until the membership entry ages out: Intel heard nothing from restarted
# Thor processes for 313-381 s. With the querier on, delivery resumed in
# 0.2 s. See docs/physical/intel_thor_transport.md.
[Bridge]
MulticastQuerier=yes
