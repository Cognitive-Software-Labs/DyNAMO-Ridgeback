# Rendered by time_sync with the Intel host's existing internet sources.
@UPSTREAMS@
allow 192.168.131.0/24
local stratum 10
makestep 1 3
# Slew internet corrections slowly. Sensor stamps and the PTP time Thor follows
# both come from this wall clock; chrony's default rate can apply a
# millisecond correction within tens of milliseconds. At 500 ppm a 1 ms
# correction takes 2 s, which phc2sys and Thor track continuously, and a 33 ms
# frame interval changes by at most about 17 us.
maxslewrate 500
