# Rendered by tools/intel_thor/ptp_sync as /etc/linuxptp/dynamo-ptp4l.conf.
# Intel is the robot Ethernet's only PTP time server. It serves its own wall
# clock, which phc2sys copies into eno1's hardware clock; chrony keeps that wall
# clock on UTC. Raw Ethernet (L2) on eno1, because Intel's address lives on the
# br0 bridge rather than on the port itself.
[global]
domainNumber            0
priority1               10
serverOnly              1
time_stamping           hardware
network_transport       L2
delay_mechanism         E2E
logSyncInterval         -3
logAnnounceInterval     0
logMinDelayReqInterval  -3
tx_timestamp_timeout    20
summary_interval        6
