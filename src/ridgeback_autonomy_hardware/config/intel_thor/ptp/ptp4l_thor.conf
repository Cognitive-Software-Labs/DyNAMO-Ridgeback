# Rendered by tools/intel_thor/ptp_sync as /etc/linuxptp/dynamo-ptp4l.conf.
# Thor follows Intel's hardware clock over the robot Ethernet and never serves.
[global]
domainNumber            0
clientOnly              1
time_stamping           hardware
network_transport       L2
delay_mechanism         E2E
logMinDelayReqInterval  -3
tx_timestamp_timeout    20
summary_interval        6
# Step, rather than slew, when the hardware clock is more than 1 ms off the
# master after start-up. On 2026-10-16 a 30 s cable pull left Thor's PHC 1.16 s
# off; without a step threshold ptp4l slewed at about 488 ppm, roughly 40 minutes
# of Thor time running over a second behind Intel. Normal offsets are
# microseconds, so this only fires after a fault.
step_threshold          0.001
