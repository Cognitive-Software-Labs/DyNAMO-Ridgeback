# Isaac resources for the logical names used by target-distance benchmark
# scenarios. Paths are relative to this file.
#
# The public world keeps its Gazebo name; g1_distance_calibration is Isaac's
# stage of the same geometry. Resources spawn at the literal requested height,
# as in Gazebo: g1.usda puts its origin at ground contact, and the default
# spawn_z_m of 0.0 leaves it 5 cm into the 0.05 m floor exactly where the
# Gazebo model stands.
#
# No scene objects are listed, so a scenario that places any is rejected
# before launch with the missing names.
schema: ridgeback_benchmark_assets/1

worlds:
  target_distance_calibration:
    native_name: g1_distance_calibration
    resource: isaac/usd/worlds/g1_distance_calibration.usda
    format: usd

targets:
  g1:
    resource: isaac/usd/models/g1/g1.usda
    format: usd
