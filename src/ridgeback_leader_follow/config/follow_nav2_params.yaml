# Nav2 for leader following in simulation. Generated from
# src/ridgeback_autonomy/config/nav2_params.yaml (exploration, unchanged) with:
# odom as the global frame (no map or SLAM), a 20 m rolling global costmap
# without a static layer, and only the navigate_to_pose navigator. The
# follow_controller selects config/behavior_trees/follow_leader.xml per goal.
# The goal checker requires the standoff heading (within 0.3 rad), so the robot
# turns to keep the leader in camera view. The launch rewrites odom_topic per
# simulator. MPPI vx_max is the platform limit, 1.3 m/s (exploration: 0.5), so
# the robot can catch up after yielding; with wider vx sampling
# and a stronger PathFollowCritic: the exploration weights held MPPI near
# 0.6 m/s. The collision monitor adds a stop zone and
# counts two lidar points, so legs register; it is an emergency backstop. Both
# costmaps add people_layer (predicted bystanders from people_predictor), and
# the controller follows people_predictor's speed_limit, so planning and pacing
# respond to where people are heading. The local costmap is 10 x 10 m: MPPI only
# follows the path inside it, and a 5 m window capped it below 1 m/s.
bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: platform/odom/filtered
    bt_loop_duration: 10
    default_server_timeout: 2000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    odom_topic: platform/odom/filtered
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.3
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.3
      vy_std: 0.1
      wz_std: 0.4
      vx_max: 1.3
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 6.0
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: Omni
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 7.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        offset_from_furthest: 20
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1
local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint: '[[0.475762, 0.073265], [0.409768, 0.319557], [0.393065, 0.348488], [0.367198, 0.374355], [0.339166, 0.390539], [0.302752, 0.400297], [-0.302752, 0.400297], [-0.339166, 0.390539], [-0.367198,
        0.374355], [-0.393065, 0.348488], [-0.409768, 0.319557], [-0.475762, 0.073265], [-0.475762, -0.073265], [-0.409768, -0.319557], [-0.393065, -0.348488], [-0.367198, -0.374355], [-0.339166, -0.390539],
        [-0.302752, -0.400297], [0.302752, -0.400297], [0.339166, -0.390539], [0.367198, -0.374355], [0.393065, -0.348488], [0.409768, -0.319557], [0.475762, -0.073265]]'
      footprint_padding: 0.0
      always_send_full_costmap: true
      plugins:
      - voxel_layer
      - people_layer
      - inflation_layer
      people_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Bystanders' current and predicted positions from people_predictor.
        # Its ring of points beyond obstacle_max_range clears the previous
        # prediction on every update; the lidar layer is unaffected.
        observation_sources: people
        people:
          topic: leader_follow/people_obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 6.0
          raytrace_min_range: 0.0
          raytrace_max_range: 7.5
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.75
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan scan_rear
        scan:
          topic: sensors/lidar2d_0/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
        scan_rear:
          topic: sensors/lidar2d_1/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 20
      height: 20
      footprint: '[[0.475762, 0.073265], [0.409768, 0.319557], [0.393065, 0.348488], [0.367198, 0.374355], [0.339166, 0.390539], [0.302752, 0.400297], [-0.302752, 0.400297], [-0.339166, 0.390539], [-0.367198,
        0.374355], [-0.393065, 0.348488], [-0.409768, 0.319557], [-0.475762, 0.073265], [-0.475762, -0.073265], [-0.409768, -0.319557], [-0.393065, -0.348488], [-0.367198, -0.374355], [-0.339166, -0.390539],
        [-0.302752, -0.400297], [0.302752, -0.400297], [0.339166, -0.390539], [0.367198, -0.374355], [0.393065, -0.348488], [0.409768, -0.319557], [0.475762, -0.073265]]'
      footprint_padding: 0.0
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - obstacle_layer
      - people_layer
      - inflation_layer
      people_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # Bystanders' current and predicted positions from people_predictor.
        # Its ring of points beyond obstacle_max_range clears the previous
        # prediction on every update; the lidar layer is unaffected.
        observation_sources: people
        people:
          topic: leader_follow/people_obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 6.0
          raytrace_min_range: 0.0
          raytrace_max_range: 7.5
          inf_is_valid: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan scan_rear
        scan:
          topic: sensors/lidar2d_0/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
        scan_rear:
          topic: sensors/lidar2d_1/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.75
planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 1.5
      use_astar: false
      allow_unknown: true
smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    global_frame: odom
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.5
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 1.3
    - 1.3
    - 4.0
    min_velocity:
    - -1.3
    - -1.3
    - -4.0
    max_accel:
    - 1.0
    - 1.0
    - 2.0
    max_decel:
    - -1.0
    - -1.0
    - -2.0
    odom_topic: platform/odom/filtered
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - StopZone
    - FootprintApproach
    # Leader following: stop whenever anything is within about 0.25 m of the
    # body (a rectangle around the 0.95 x 0.80 m footprint). Two points
    # suffice, so a person's legs at lidar height trigger it.
    StopZone:
      type: polygon
      action_type: stop
      points: "[[0.73,0.65],[0.73,-0.65],[-0.73,-0.65],[-0.73,0.65]]"
      min_points: 2
      visualize: true
      polygon_pub_topic: collision_monitor/stop_zone
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 2
      visualize: true
      polygon_pub_topic: collision_monitor/footprint_approach
      enabled: true
    observation_sources:
    - scan
    - scan_rear
    scan:
      type: scan
      topic: sensors/lidar2d_0/scan
      min_height: 0.15
      max_height: 2.0
      enabled: true
    scan_rear:
      type: scan
      topic: sensors/lidar2d_1/scan
      min_height: 0.15
      max_height: 2.0
      enabled: true
